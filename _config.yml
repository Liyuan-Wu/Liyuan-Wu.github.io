# About Section
about_title: 个人简介
about_profile_image: images/profile.jpg
about_content: |
  **5 年以上法律实务经验**，执业律师，持法律职业资格 A 证、律师执业证与证券从业资格证，英语六级，C2 驾照，中共党员，可适应出差。

  擅长企业法律风险前置管控、合规流程搭建、合同全生命周期管理与内部法律培训，前置识别经营活动中的法律隐患，年均起草、审核各类合同 200 余份，持续为省属投资国企、政府机关及院校等提供常态化合规保障。具备商事争议独立处置能力，可主导诉讼仲裁策略设计与执行，压降纠纷带来的经济与合规风险，擅长民商疑难、劳资、公司、股权、投资建设投标采购等纠纷。

content:
  - title: 核心优势
    layout: list
    content:
      - layout: left
        border: weak
        title: 资本运作与投融资
        description: |
          参与二级资本债券发行法律意见书（资质核查、募集文件合规审查、风险披露优化）、国企共益债引入尽调与方案设计（标的 1 亿元）、45 亿元项目交易文件起草，熟悉股权与债权融资结构、审批路径与信息披露要点。
      - layout: left
        title: 合同体系与内控
        description: |
          年审核合同 200 余份，主导标准文本开发与合同流程优化；审核规章制度与内控文件，出具书面法律意见，推动合规整改落地。
      - layout: left
        title: 集团客户服务
        description: |
          同时为国企、政府机关、学校、商管公司等不同单位提供常年法律顾问服务，负责合规、合同、制度建设、争议解决、法律培训及外聘专业机构管理的全流程闭环；为顾问单位建立合同全生命周期管理（起草—审核—履行跟踪—归档）、标准文本库与风险清单，重大项目介入率 94%。
      - layout: left
        title: 纠纷处理
        description: |
          擅长民商疑难、劳资、公司、股权、投资建设投标采购等纠纷处置。独立主办本金合计 6.7 亿元融资系列仲裁，为客户减损 2 亿元；主办 1.94 亿元土地行政纠纷，全额保住涉案土地相关权益；代理金融担保案件百余起，胜诉率 100%；统筹处置百余件劳资和侵权纠纷，胜诉率 97%，累计回款超 5000 万元。
      - layout: left
        title: 涉外与工具
        description: |
          英语六级，可阅读英文合同与技术资料；熟练使用 Office 及法律数据库，文书与数据整理效率高；持 C2 驾照，可适应一定量出差。

